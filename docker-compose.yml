name: rpe-card-processing

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-rpe}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rpe}
      POSTGRES_DB: ${POSTGRES_DB:-rpe}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-rpe} -d ${POSTGRES_DB:-rpe}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  localstack:
    image: localstack/localstack:3
    environment:
      SERVICES: sqs
      DEBUG: 0
    ports:
      - "4566:4566"
    volumes:
      - localstack-data:/var/lib/localstack
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:4566/_localstack/health"]
      interval: 5s
      timeout: 3s
      retries: 10

  produto-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_MODULE: produto-service
        SERVICE_PORT: 8081
    ports:
      - "${PRODUTO_SERVICE_PORT:-8081}:8081"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8081/actuator/health"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 45s

  portador-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_MODULE: portador-service
        SERVICE_PORT: 8082
    ports:
      - "${PORTADOR_SERVICE_PORT:-8082}:8082"
    depends_on:
      postgres:
        condition: service_healthy
      localstack:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8082/actuator/health"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 45s

  cartao-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_MODULE: cartao-service
        SERVICE_PORT: 8083
    ports:
      - "${CARTAO_SERVICE_PORT:-8083}:8083"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      localstack:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8083/actuator/health"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 45s

volumes:
  postgres-data:
  localstack-data:
