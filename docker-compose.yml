name: rpe-card-processing

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-rpe}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rpe}
      POSTGRES_DB: ${POSTGRES_DB:-rpe}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/init-databases.sql:/docker-entrypoint-initdb.d/init-databases.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-rpe} -d ${POSTGRES_DB:-rpe}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  localstack:
    image: localstack/localstack:3
    environment:
      SERVICES: sqs
      DEBUG: 0
    ports:
      - "4566:4566"
    volumes:
      - localstack-data:/var/lib/localstack
      - ./infra/localstack/init-queues.sh:/etc/localstack/init/ready.d/init-queues.sh:ro
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:4566/_localstack/health"]
      interval: 5s
      timeout: 3s
      retries: 10

  produto-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_MODULE: produto-service
        SERVICE_PORT: 8081
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/produto_db
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-rpe}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-rpe}
      JWT_SECRET: ${JWT_SECRET}
      JWT_ISSUER: ${JWT_ISSUER}
      JWT_AUDIENCE: ${JWT_AUDIENCE}
    ports:
      - "${PRODUTO_SERVICE_PORT:-8081}:8081"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8081/actuator/health"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 45s

  portador-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_MODULE: portador-service
        SERVICE_PORT: 8082
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/portador_db
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-rpe}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-rpe}
      JWT_SECRET: ${JWT_SECRET}
      JWT_ISSUER: ${JWT_ISSUER}
      JWT_AUDIENCE: ${JWT_AUDIENCE}
      PRODUTO_SERVICE_URL: http://produto-service:8081
      AWS_SQS_ENDPOINT: http://localstack:4566
    ports:
      - "${PORTADOR_SERVICE_PORT:-8082}:8082"
    depends_on:
      postgres:
        condition: service_healthy
      produto-service:
        condition: service_healthy
      localstack:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8082/actuator/health"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 45s

  cartao-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_MODULE: cartao-service
        SERVICE_PORT: 8083
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/cartao_db
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-rpe}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-rpe}
      PAN_CRIPTOGRAFIA_SENHA: ${PAN_CRIPTOGRAFIA_SENHA}
      PAN_CRIPTOGRAFIA_SALT: ${PAN_CRIPTOGRAFIA_SALT}
      PAN_CRIPTOGRAFIA_PEPPER: ${PAN_CRIPTOGRAFIA_PEPPER}
      AWS_SQS_ENDPOINT: http://localstack:4566
    ports:
      - "${CARTAO_SERVICE_PORT:-8083}:8083"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      localstack:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8083/actuator/health"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 45s

volumes:
  postgres-data:
  localstack-data:
