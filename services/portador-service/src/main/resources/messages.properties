# Mensagens em português (pt-BR) do serviço: o Spring Boot carrega este arquivo como MessageSource.
# Vale para QUALQUER idioma pedido pelo cliente (não há messages_en): a API responde sempre em
# português, e não só quando o navegador manda Accept-Language: pt-BR (issue #119).
#
# 1) Bean Validation. O Spring Boot resolve a mensagem de cada restrição aqui ANTES do bundle
#    embutido do Hibernate Validator (que é inglês fora de pt). O texto é o COMPLEMENTO do nome do
#    campo, que a resposta traz à parte ({"field":"nome","message":"não pode estar em branco"}).
jakarta.validation.constraints.AssertFalse.message=deve ser falso
jakarta.validation.constraints.AssertTrue.message=deve ser verdadeiro
jakarta.validation.constraints.DecimalMax.message=deve ser menor que ${inclusive == true ? 'ou igual a ' : ''}{value}
jakarta.validation.constraints.DecimalMin.message=deve ser maior que ${inclusive == true ? 'ou igual a ' : ''}{value}
jakarta.validation.constraints.Digits.message=valor numérico fora do limite (esperado até {integer} dígitos inteiros e {fraction} decimais)
jakarta.validation.constraints.Email.message=deve ser um endereço de e-mail válido
jakarta.validation.constraints.Future.message=deve ser uma data no futuro
jakarta.validation.constraints.FutureOrPresent.message=deve ser uma data no presente ou no futuro
jakarta.validation.constraints.Max.message=deve ser menor ou igual a {value}
jakarta.validation.constraints.Min.message=deve ser maior ou igual a {value}
jakarta.validation.constraints.Negative.message=deve ser menor que zero
jakarta.validation.constraints.NegativeOrZero.message=deve ser menor ou igual a zero
jakarta.validation.constraints.NotBlank.message=não pode estar em branco
jakarta.validation.constraints.NotEmpty.message=não pode estar vazio
jakarta.validation.constraints.NotNull.message=é obrigatório
jakarta.validation.constraints.Null.message=deve ser nulo
jakarta.validation.constraints.Past.message=deve ser uma data no passado
jakarta.validation.constraints.PastOrPresent.message=deve ser uma data no passado ou no presente
jakarta.validation.constraints.Pattern.message=deve corresponder ao padrão "{regexp}"
jakarta.validation.constraints.Positive.message=deve ser maior que zero
jakarta.validation.constraints.PositiveOrZero.message=deve ser maior ou igual a zero
jakarta.validation.constraints.Size.message=o tamanho deve estar entre {min} e {max}

# 2) ProblemDetail (RFC 9457) dos erros que o próprio Spring MVC gera, antes de qualquer código
#    nosso (corpo ilegível, parâmetro ausente, método não suportado...). Chave: problemDetail.<classe>
#    para o detalhe e problemDetail.title.<classe> para o título; {0}, {1}... são os argumentos da
#    exceção e a aspa simples é escapada em dobro ('') por ser MessageFormat. ATENÇÃO: só quando a
#    exceção passa argumentos; sem argumentos o Spring devolve o texto cru, sem MessageFormat (por
#    isso as mensagens sem {n} não usam aspas escapadas).
problemDetail.title.org.springframework.http.converter.HttpMessageNotReadableException=Requisição ilegível
problemDetail.org.springframework.http.converter.HttpMessageNotReadableException=O corpo da requisição está ausente, malformado ou tem valores de tipo inválido
problemDetail.title.org.springframework.beans.TypeMismatchException=Parâmetro inválido
# O título usa a classe CONCRETA da exceção; o detalhe, a superclasse TypeMismatchException.
problemDetail.title.org.springframework.web.method.annotation.MethodArgumentTypeMismatchException=Parâmetro inválido
problemDetail.org.springframework.beans.TypeMismatchException=O valor ''{1}'' não é válido para o parâmetro ''{0}''
problemDetail.title.org.springframework.web.bind.MissingServletRequestParameterException=Parâmetro obrigatório ausente
problemDetail.org.springframework.web.bind.MissingServletRequestParameterException=O parâmetro obrigatório ''{0}'' não foi informado
problemDetail.title.org.springframework.web.HttpRequestMethodNotSupportedException=Método não permitido
problemDetail.org.springframework.web.HttpRequestMethodNotSupportedException=O método ''{0}'' não é suportado neste endereço
problemDetail.title.org.springframework.web.HttpMediaTypeNotSupportedException=Tipo de conteúdo não suportado
problemDetail.org.springframework.web.HttpMediaTypeNotSupportedException=O Content-Type ''{0}'' não é suportado; use application/json
problemDetail.title.org.springframework.web.HttpMediaTypeNotAcceptableException=Formato de resposta não aceito
problemDetail.org.springframework.web.HttpMediaTypeNotAcceptableException=Não há representação disponível para os formatos aceitos pelo cliente
problemDetail.title.org.springframework.web.servlet.resource.NoResourceFoundException=Recurso não encontrado
problemDetail.org.springframework.web.servlet.resource.NoResourceFoundException=Nenhum recurso encontrado neste endereço
problemDetail.title.org.springframework.web.method.annotation.HandlerMethodValidationException=Parâmetros inválidos
problemDetail.org.springframework.web.method.annotation.HandlerMethodValidationException=Um ou mais parâmetros da requisição são inválidos
