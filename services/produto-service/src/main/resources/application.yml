server:
  port: 8081

logging:
  structured:
    format:
      console: ecs
    ecs:
      service:
        name: produto-service

spring:
  application:
    name: produto-service
  mvc:
    problemdetails:
      enabled: true
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/produto_db}
    username: ${SPRING_DATASOURCE_USERNAME:rpe}
    password: ${SPRING_DATASOURCE_PASSWORD:rpe}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  cloud:
    aws:
      region:
        static: ${AWS_REGION:us-east-1}
      credentials:
        access-key: ${AWS_ACCESS_KEY_ID:test}
        secret-key: ${AWS_SECRET_ACCESS_KEY:test}
      sqs:
        endpoint: ${AWS_SQS_ENDPOINT:http://localhost:4566}

rpe:
  jwt:
    secret: ${JWT_SECRET:dev-only-insecure-secret-troque-em-producao-32chars}
    issuer: ${JWT_ISSUER:https://portador-service.rpe.local}
    audience: ${JWT_AUDIENCE:rpe-api}
  produto:
    mensageria:
      produto-eventos-queue: produto-eventos-queue

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    # Guarda o token colado em "Authorize" ao recarregar a página.
    persist-authorization: true
  api-docs:
    path: /v3/api-docs
