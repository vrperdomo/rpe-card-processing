name: ci-backend

on:
  pull_request:
    branches: [develop, main]
    paths:
      - "pom.xml"
      - "services/**"
      - ".github/workflows/ci-backend.yml"
  push:
    branches: [develop, main]
    paths:
      - "pom.xml"
      - "services/**"
      - ".github/workflows/ci-backend.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      services: ${{ steps.filter.outputs.changes }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            produto-service:
              - 'pom.xml'
              - 'services/produto-service/**'
            portador-service:
              - 'pom.xml'
              - 'services/portador-service/**'
            cartao-service:
              - 'pom.xml'
              - 'services/cartao-service/**'

  build:
    needs: changes
    if: ${{ needs.changes.outputs.services != '[]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.changes.outputs.services) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Verificar formatacao (Spotless)
        run: ./mvnw -B -pl services/${{ matrix.service }} -am spotless:check

      - name: Build, testes (unit + integracao) e gate de cobertura
        run: ./mvnw -B -pl services/${{ matrix.service }} -am verify

      - name: Publicar relatorios de teste e cobertura
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: reports-${{ matrix.service }}
          retention-days: 7
          path: |
            services/${{ matrix.service }}/target/surefire-reports
            services/${{ matrix.service }}/target/failsafe-reports
            services/${{ matrix.service }}/target/site/jacoco
