name: pr-lint

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  titulo-conventional-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            refactor
            perf
            test
            docs
            build
            ci
            chore
            style
            revert

  nome-da-branch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Validar padrao de nome da branch (CLAUDE.md secao 4)
        env:
          BRANCH: ${{ github.head_ref }}
        run: |
          # Branches do Dependabot (dependabot/maven/..., dependabot/docker/...) sao geradas
          # automaticamente pelo GitHub e nao seguem (nem podem seguir) o padrao <tipo>/<issue>-<slug>
          # da CLAUDE.md secao 4 — nao ha issue nem slug para um bump de dependencia automatico.
          if [[ "$BRANCH" =~ ^dependabot/ ]]; then
            echo "Branch do Dependabot, isenta da validacao de nome: $BRANCH"
            exit 0
          fi
          if [[ ! "$BRANCH" =~ ^(feature|bugfix|docs|ci|chore)/[0-9]+-[a-z0-9-]+$ ]] && \
             [[ ! "$BRANCH" =~ ^(release|hotfix)/[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Nome de branch invalido: $BRANCH"
            echo "Esperado: feature|bugfix|docs|ci|chore/<issue>-<slug>, ou release|hotfix/<x.y.z>"
            exit 1
          fi
          echo "Branch valida: $BRANCH"
