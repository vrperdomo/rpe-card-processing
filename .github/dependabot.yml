version: 2
updates:
  # target-branch: develop em todos os ecossistemas — o git flow do projeto (CLAUDE.md secao 4)
  # exige que toda mudanca passe por develop antes de main; sem isso, o Dependabot abria PRs
  # direto contra main (branch padrao do repositorio), pulando develop e a esteira normal de CI.
  - package-ecosystem: maven
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    open-pull-requests-limit: 10

  - package-ecosystem: docker
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    open-pull-requests-limit: 10

  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      # init, analyze e upload-sarif do CodeQL precisam estar na MESMA versao: o analyze le a
      # configuracao gravada pelo init e aborta se as versoes diferirem ("Loaded a configuration
      # file for version X, but running version Y"). Em PRs separados (um por action) cada PR sobe
      # so uma delas e o CodeQL falha em todos; agrupadas, chegam juntas em um unico PR.
      codeql-action:
        patterns:
          - "github/codeql-action"
          - "github/codeql-action/*"
