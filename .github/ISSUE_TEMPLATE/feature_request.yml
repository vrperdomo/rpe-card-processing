name: Nova funcionalidade / melhoria
description: Propor algo novo ou uma melhoria em um serviço existente
labels: ["enhancement"]
body:
  - type: textarea
    id: contexto
    attributes:
      label: Contexto
      description: Qual problema isso resolve? Referencie a seção do PRD/CLAUDE.md se aplicável.
    validations:
      required: true
  - type: textarea
    id: criterios-aceite
    attributes:
      label: Critérios de aceite
      description: Lista objetiva do que precisa ser verdade para considerar concluído.
      placeholder: |
        - [ ] ...
        - [ ] ...
    validations:
      required: true
  - type: dropdown
    id: servico
    attributes:
      label: Serviço(s) afetado(s)
      multiple: true
      options:
        - produto-service
        - portador-service
        - cartao-service
        - infra (docker-compose / CI)
        - frontend
    validations:
      required: true
