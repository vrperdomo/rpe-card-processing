# Nginx do frontend: serve o build estático (SPA) e é o único ponto de entrada do browser.
# As rotas /api/v1/* são encaminhadas ao serviço dono de cada recurso, então o browser só fala com
# UMA origem: não há chamada cross-origin e nenhum backend precisa de CORS (ADR-008).

server {
  listen 8080;
  server_name _;
  server_tokens off;

  root /usr/share/nginx/html;
  index index.html;

  client_max_body_size 1m;

  # DNS embutido do Docker. Com o nome do serviço em variável, o Nginx resolve a cada requisição
  # (valid=10s) em vez de só na subida: o frontend sobe e continua de pé mesmo com um backend fora.
  resolver 127.0.0.11 valid=10s ipv6=off;

  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "no-referrer" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 'ok';
  }

  # Arquivos com hash no nome (Vite): cache longo e seguro.
  location /assets/ {
    expires 1y;
    try_files $uri =404;
  }

  # index.html nunca em cache, senão um deploy novo não chega ao usuário.
  location = /index.html {
    expires -1;
  }

  location / {
    try_files $uri /index.html;
  }

  location /api/v1/auth/ {
    set $upstream http://portador-service:8082;
    include /etc/nginx/rpe-proxy.conf;
  }

  location /api/v1/portadores {
    set $upstream http://portador-service:8082;
    include /etc/nginx/rpe-proxy.conf;
  }

  location /api/v1/produtos {
    set $upstream http://produto-service:8081;
    include /etc/nginx/rpe-proxy.conf;
  }

  location /api/v1/cartoes {
    set $upstream http://cartao-service:8083;
    include /etc/nginx/rpe-proxy.conf;
  }

  # Só erros gerados pelo próprio Nginx (backend fora/lento) caem aqui; um 503 devolvido pelo
  # serviço (ex.: dependência indisponível, com Retry-After) passa intacto (proxy_intercept_errors
  # off). O corpo segue o formato ProblemDetail (RFC 9457) que a UI já sabe tratar.
  error_page 502 503 504 = @api_indisponivel;

  location @api_indisponivel {
    default_type application/problem+json;
    return 503 '{"type":"about:blank","title":"Serviço indisponível","status":503,"detail":"O serviço solicitado está indisponível no momento; tente novamente em instantes"}';
  }
}
