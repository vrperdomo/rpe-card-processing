# Diretivas comuns das rotas /api/v1/* (incluído por frontend/nginx.conf; $upstream vem do location).
proxy_pass $upstream;
proxy_http_version 1.1;

proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;
# SOBRESCREVE em vez de acrescentar ($proxy_add_x_forwarded_for): este Nginx é a borda, então o
# X-Forwarded-For que o cliente mandou não é confiável. O Portador usa esse IP para limitar as
# tentativas de login; se o valor forjado do cliente passasse, bastaria mudá-lo a cada tentativa
# para escapar do limite (ADR-009).
proxy_set_header X-Forwarded-For $remote_addr;
# X-Correlation-Id do cliente (se houver) segue como veio; senão o serviço gera um.

proxy_connect_timeout 3s;
proxy_read_timeout 15s;
proxy_send_timeout 15s;
